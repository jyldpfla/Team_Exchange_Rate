server {
  listen 80;
  server_name _;

  # 정적 파일
  root /usr/share/nginx/html;
  index index.html;

  # 프론트 라우팅 (SPA)
  location / {
    try_files $uri /index.html;
  }

  # API 프록시 -> 백엔드 서비스 이름과 포트 사용
  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
