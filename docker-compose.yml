services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # - TZ=Asia/Seoul
      # DB 필요 시 여기에 JDBC_URL 등 환경변수 추가
    # ports:
    #   # 백엔드를 단독으로도 보고 싶다면 열고,
    #   # 프론트 프록시만 쓸 거면 주석 처리해도 됨.
    #   - "8080:8080"
    expose:
      - "8080"
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8005:80"         # <-- 최종 접속 포트
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
