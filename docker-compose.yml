version: "3.9"

services:
  # ─────────────────────────────
  # Backend (Spring Boot)
  # ─────────────────────────────
  backend:
    container_name: app-staging-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mbc_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/mbc_mongo
    ports:
      - "8081:8080"      # ✅ 호스트포트 8081로 변경 (Jenkins와 충돌 방지)
    depends_on:
      - postgres
      - mongo
    networks:
      - appnet

  # ─────────────────────────────
  # Frontend (Vite + Nginx)
  # ─────────────────────────────
  frontend:
    container_name: app-staging-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8005:80"        # 외부 접속용 (기존 유지)
    depends_on:
      - backend
    networks:
      - appnet

  # ─────────────────────────────
  # PostgreSQL
  # ─────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: db-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mbc_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - appnet

  # ─────────────────────────────
  # MongoDB
  # ─────────────────────────────
  mongo:
    image: mongo:6
    container_name: db-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - appnet

# ─────────────────────────────
# Networks & Volumes
# ─────────────────────────────
networks:
  appnet:
    driver: bridge

volumes:
  pgdata:
  mongodata:
